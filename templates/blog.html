{% extends "base.html" %}

{# No glyph fields or code here: skip the Roboto Mono preload. #}
{% block mono_preload %}{% endblock mono_preload %}

{% block content %}

{{ <head_plate title={section.title} lead={section.description} src="/img/sky.avif" bits="no" /> }}

<section class="sheet">
  <div class="container">
    {% if section.pages %}
    <div class="post-list">
      {% for post in section.pages %}
        {{ <post_row post /> }}
      {% endfor %}
    </div>
    {% endif %}
  </div>
</section>

{% endblock content %}
