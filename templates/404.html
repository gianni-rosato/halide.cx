{% extends "base.html" %}
{% block content %}

<section class="hero">
  <div class="container">
    <span class="eyebrow">Error 404</span>
    <h1 class="hero__title">Page not found</h1>
    <p class="hero__lead">
      The page you're looking for doesn't exist, or has moved somewhere else.
    </p>
    <div class="actions hero__actions">
      <a href="{{ get_url(path='@/_index.md') }}"
        class="btn btn--primary">Back home</a>
      <a href="{{ get_url(path='@/blog/_index.md') }}"
        class="btn btn--secondary">Read the blog</a>
    </div>
  </div>
</section>

{% endblock content %}
